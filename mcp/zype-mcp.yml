source: https://github.com/zype/zype-mcp-client (README, Apache-2.0, last pushed 2026-02-21) and https://registry.npmjs.org/@zype-com/mcp
name: Zype MCP Client
description: First-party Model Context Protocol server that exposes the Zype video platform (videos, transcriptions,
  playlists, categories, subtitles, analytics, monetization, zobjects and the player) to MCP-speaking AI assistants.
  Distributed as an npm package run over stdio; Zype publishes no hosted/remote MCP endpoint.
status: published
deployment:
  mode: local-stdio
  endpoint: null
  install: npx -y @zype-com/mcp
  package: https://www.npmjs.com/package/@zype-com/mcp
  auth: api-key
  verified: searched
note: 'mode is local-stdio, not remote: every configuration example Zype publishes (Cursor, Claude Desktop, Gemini
  CLI) is a `command: npx` stdio block, and no https MCP endpoint appears anywhere in the repo, the npm package
  metadata, docs.zype.com, or either llms.txt. An agent cannot reach this server without a human installing it first.
  No endpoint URL was guessed or probed into existence.'
authentication:
  env:
  - name: ZYPE_API_KEY
    required: true
    description: Zype Admin API Key, from Zype Dashboard -> Settings -> API Keys
  - name: ZYPE_MCP_MODE
    required: false
    default: safe
    description: 'Access mode: readonly, safe, or full'
  note: Uses the Zype Admin API Key directly. It does not use the OAuth authorization server at api.zype.com, so
    none of the 148 published scopes constrain it — the safety boundary is the ZYPE_MCP_MODE env var, not a token
    scope.
access_modes:
- mode: readonly
  description: Only read operations allowed.
- mode: safe
  description: 'Read + write allowed. Destructive operations require confirm: true. Zype''s recommended default.'
- mode: full
  description: All operations allowed without confirmation.
