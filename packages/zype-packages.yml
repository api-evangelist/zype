note: 'Zype''s only currently-maintained first-party package is the MCP server, published twice under two npm names
  at the same version. Every other first-party client library predates 2024: the Ruby gem last shipped in 2018 and
  the Python client repo last saw a push in 2023 and was never published to PyPI by Zype (the `zype` project on
  PyPI belongs to a third party). That gap is the finding — the REST surface has grown to 317 operations across
  15 OpenAPI files while the SDKs that wrap it have not moved in years.'
