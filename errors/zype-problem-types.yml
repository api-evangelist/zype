rfc9457: false
note: Zype does NOT use RFC 9457 problem+json. Every one of the 383 documented 4xx/5xx responses across all 15 specs
  declares application/json, and the documented envelope is a single `message` string. There is no machine-readable
  error code, no type URI, and no per-error catalogue anywhere on docs.zype.com — an agent cannot branch on anything
  but the HTTP status.
