aid: zype
name: Zype
description: Zype is an API-first video content management and streaming platform used by enterprises and media
  companies to run OTT apps, FAST and linear channels, and global video distribution. The platform spans a video
  CMS and CRM, cloud encoding, multi-CDN delivery, AI-assisted metadata, transcription and translation, SSAI advertising
  and DRM, subscription and transactional monetization, consumer entitlements, TV Everywhere authentication, cloud
  playout scheduling with XMLTV and platform EPG export, and a no-code app builder for web, mobile and connected
  TV. Zype publishes fifteen OpenAPI 3.0.1 definitions covering 317 operations, an RFC 8414 OAuth authorization
  server advertising 148 scopes, and a first-party MCP server. Zype is a Backlight business.
type: Index
accessModel:
  pricing: paid
  onboarding: sales
  trial: false
  try_now: false
  public: true
  label: Paid, sales-led
  confidence: high
  source:
  - https://www.zype.com/pricing
  generated: '2026-08-28'
  method: searched
  note: Corrected from "freemium". Zype publishes seven named, priced plans on zype.com/pricing (from $500/mo on
    annual terms) and every one closes with Contact Sales. There is no free tier, no trial and no self-serve checkout.
    Documentation and the OpenAPI definitions are fully public; only the keys are gated.
position: Consumer
