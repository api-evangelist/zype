      - name: filters[video_title_eq]
        in: query
        schema:
          type: string
        description: Filter records with specified `video_title`
      - name: interval
        in: query
        schema:
          type:
          - string
          - 'null'
          enum:
          - null
          - day
        description: 'Shortcut method to group records by time intervals. Accepted values: `day`.'
      - name: group_by
        in: query
        schema:
          type: array
          items:
            type:
            - string
            - 'null'
            enum:
            - null
            - browser
            - browser_version
            - os
            - os_version
            - player_name
            - video_id
            - device_name
            - revenue_model_name
            - consumer_id
            - name
            - consumer_email
            - country
            - domain
            - tracking_code
            - tracking_partner
            - video_title
            - start_date
        description: 'Group records by one or more properties of the data returned -- accepted values are: `browser`, `browser_version`, `os`, `os_version`, `player_name`, `video_id`, `device_name`, `revenue_model_name`, `consumer_id`, `name`, `consumer_email`, `country`, `domain`, `tracking_code`, `tracking_partner`, `video_title`, `start_date`'
      - name: counts
        in: query
        schema:
          type: array
          items:
            type: string
        description: Return count of records per grouping. Using counts = ["*"] for generic count of all records in grouping, response will include `request_count`.
      - name: limit
        in: query
        schema:
          type: integer
        description: Limit the number of records returned
      - name: sort_by
        in: query
        schema:
          type:
          - string
          - 'null'
          enum:
          - null
          - id_asc
          - id_desc
          - browser_asc
          - browser_desc
          - browser_version_asc
          - browser_version_desc
          - os_asc
          - os_desc
          - os_version_asc
          - os_version_desc
          - player_name_asc
          - player_name_desc
          - video_id_asc
          - video_id_desc
          - device_name_asc
          - device_name_desc
          - revenue_model_name_asc
          - revenue_model_name_desc
          - consumer_id_asc
          - consumer_id_desc
          - name_asc
          - name_desc
          - consumer_email_asc
          - consumer_email_desc
          - country_asc
          - country_desc
          - domain_asc
          - domain_desc
          - tracking_code_asc
          - tracking_code_desc
          - tracking_partner_asc
          - tracking_partner_desc
          - video_title_asc
          - video_title_desc
          - start_date_asc
          - start_date_desc
        description: Sort results by value of a specific property + '_' + sort direction (Example - sort_by=start_date_asc, or sort_by=consumer_email_desc)
      responses:
        '200':
          description: See below for example responses
          content:
            application/json:
              schema:
                title: PlayerRequestsResponse
                type: object
                properties:
                  data:
                    type: array
                    items:
                      title: PlayerRequest
                      type: object
                      properties:
                        id:
                          type: string
                        browser:
                          type: string
                        browser_version:
                          type: string
                        os:
                          type: string
                        os_version:
                          type: string
                        player_name:
                          type: string
                        video_id:
                          type: string
                        device_name:
                          type: string
                        revenue_model_name:
