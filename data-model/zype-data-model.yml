source: path structure and *_id reference fields across the 15 files in openapi/; entity descriptions cross-checked
  against https://docs.zype.com/reference/
note: 'Derived from paths and id-reference fields rather than from schema $refs: NONE of Zype''s 15 OpenAPI files
  declares a single entry under components.schemas. Every request and response body is inlined, so there is no reusable
  object model in the contract and no $ref graph to walk. That absence is itself the headline finding — a consumer
  cannot generate typed models from these specs without first factoring them out.'
id_format: 24-character hexadecimal (MongoDB ObjectId), e.g. 5992f328ce593000ef000008. No type prefixes.
root: site (channel) — every key is scoped to one Zype site; site_id appears on 19 distinct operations and cross-site
  reads return 404 rather than 403.
