created: '2026-05-04'
modified: '2026-08-28'
note: REPLACES the generated 2026-05-04 scaffold, which invented Free/Professional/Enterprise tiers and per-minute
  request limits Zype has never published. Zype publishes seven real, named, priced product plans across three product
  lines, all quoted "based on annual terms" with a Contact Sales close — there is no self-serve checkout, no free
  tier and no API-call-metered plan. API access is bundled into the product tier, not sold by request volume, so
  there is no per-request quota or overage to record anywhere on this page.
